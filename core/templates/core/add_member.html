{% load static %}
<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አዲስ አባል መመዝገቢያ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 600px;">
        <div class="card shadow p-4">
            <div class="text-center mb-4">
                <h3 class="text-primary fw-bold">«በቅ.ሚካኤል ቤ.ክ የአካባቢ ልጆች መ.እድር»</h3>
                <p class="text-muted">አዲስ አባል መመዝገቢያ ፎርም</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">ሙሉ ስም (Full Name)</label>
                    <input type="text" name="full_name" class="form-control" placeholder="የአባሉን ሙሉ ስም ያስገቡ" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">ስልክ ቁጥር (Phone Number)</label>
                    <input type="text" name="phone_number" class="form-control" placeholder="09..." required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">አድራሻ (Address)</label>
                    <input type="text" name="address" class="form-control" placeholder="ቀበሌ / አካባቢ" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">አባል መዝግብ (Save)</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'dashboard' %}" class="text-decoration-none">ወደ ዳሽቦርድ ተመለስ</a>
            </div>
        </div>
    </div>
</body>
</html>
