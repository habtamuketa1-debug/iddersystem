databases:
  - name: iddir_db
    databaseName: iddir
    user: iddir_user

services:
  - type: web
    name: iddersystem
    env: python
    buildCommand: "./iddir_project/build.sh"
    startCommand: "gunicorn iddir_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: iddir_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4